# A self-hosted relay, in one command: `docker compose up --build`.
#
# What this file deliberately does not do is terminate TLS. The relay speaks plain HTTP/WebSocket, and
# putting a proxy in front of it is the operator's decision — with two consequences that are easy to
# get wrong and are called out in docs/operations/docker.md:
#
#   1. the carrier socket is **long-lived and quiet**; a proxy whose read timeout is shorter than the
#      tunnel's idle window will close it on a schedule, and the daemon will reconnect forever;
#   2. the client is served over the same origin, so the proxy has to forward `/client/*` too.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: dr.dsh-relay:latest
    restart: unless-stopped
    ports:
      # Bound to localhost by default. Publishing a plaintext relay on a public interface is a
      # decision, not a default: put TLS in front of it (see docs/operations/docker.md) or keep it on
      # a private network.
      - "127.0.0.1:8787:8787"
    environment:
      DSH_RELAY_BIND: 0.0.0.0:8787
      RUST_LOG: info
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
